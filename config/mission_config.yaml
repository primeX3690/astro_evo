# config/mission_config.yaml
mission:
  origin: LEO
  destination: GEO
  max_delta_v_kms: 6.0
  max_time_hours: 12.0

genetic_algorithm:
  population_size: 40
  generations: 40
  mutation_rate: 0.3
  elite_count: 2
  seed: 42

ppo:
  hidden_size: 32
  learning_rate: 0.005
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  epochs_per_update: 4
  minibatch_size: 64
  episodes_per_rollout: 10
  training_iterations: 1000   # 1000 x 10 = 10,000 episodes, ~3 min CPU

lander:
  start_altitude_m: 50.0
  start_x_range_m: 8.0

rocket:
  dry_mass_kg: 500
  propellant_mass_kg: 800
  isp_seconds: 300
  thrust_newtons: 2000