# config/mission_config.yaml
mission:
  origin: LEO
  destination: GEO
  max_delta_v_kms: 6.0
  max_time_hours: 12.0

genetic_algorithm:
  population_size: 40
  generations: 40
  mutation_rate: 0.3
  elite_count: 2
  seed: 42

ppo:
  hidden_size: 32
  learning_rate: 0.005
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  epochs_per_update: 4
  minibatch_size: 64
  episodes_per_rollout: 10
  training_iterations: 1000   # 1000 x 10 = 10,000 episodes, ~3 min CPU

lander:
  start_altitude_m: 50.0
  start_x_range_m: 8.0

rocket:
  dry_mass_kg: 500
  propellant_mass_kg: 800
  isp_seconds: 300
  thrust_newtons: 2000
tle_validation:
  norad_id: 25544
  orbits: 3

oem_export:
  orbit: LEO
  inclination_deg: 51.6
  duration_hours: 2.0
  dt_seconds: 60.0
  object_name: ASTROEVO_SAT
  object_id: 2026-001A
  output_path: mission_output.oem

ground_ops:
  orbit: LEO
  inclination_deg: 51.6
  duration_hours: 24.0
  station_name: Gorakhpur
  station_lat_deg: 26.7606
  station_lon_deg: 83.3732
  station_alt_km: 0.084
  min_elevation_deg: 10.0
  tx_power_w: 1.0
  tx_antenna_gain_dbi: 0.0
  tx_line_loss_db: 0.5
  freq_hz: 437000000.0
  rx_antenna_gain_dbi: 15.0
  rx_system_noise_temp_k: 600.0
  rx_line_loss_db: 0.5
  data_rate_bps: 9600
  required_eb_n0_db: 10.0
